version: '3.8'

services:
  bgtags:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bgtags
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      # Set explicit external domain (e.g. https://bgtags.cklein.us) or leave empty to auto-detect IP:PORT
      - BASE_URL=${BASE_URL:-}
      - DB_PATH=/app/data/bgtags.db
      - BACKUP_ENABLED=true
      - BACKUP_DIR=/app/backups
      - BACKUP_TIME=00:00
      - BACKUP_RETENTION=30
    volumes:
      - ./data:/app/data
      - ./static/rules:/app/static/rules
      - ./static/img:/app/static/img
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
