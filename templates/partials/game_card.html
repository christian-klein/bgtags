{{define "game_card.html"}}
<article class="game-card">
    <div class="card-media">
        <img src="/img/{{.Image}}" alt="{{.Name}}" class="game-cover" loading="lazy">
        <div class="qr-overlay">
            <img src="{{.QRCodeURL}}" alt="QR Code for {{.Name}}" class="qr-code">
            <span class="qr-hint">Scan for Rules</span>
        </div>
    </div>
    <div class="card-body">
        <div class="card-header">
            <h2 class="game-title">{{.Name}}</h2>
            <div class="card-badges">
                <span class="badge players-badge">👥 {{.MinPlayers}}-{{.MaxPlayers}} Players{{if .BestPlayers}} (Best: {{.BestPlayers}}){{end}}</span>
                {{if gt .Complexity 0.0}}
                <span class="badge complexity-badge">🧠 {{printf "%.1f" .Complexity}} / 5</span>
                {{end}}
            </div>
        </div>
        <div class="card-actions">
            <a href="{{.RulesURL}}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                📖 View Rules PDF
            </a>
            {{if .BggURL}}
            <a href="{{.BggURL}}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" title="Open on BoardGameGeek">
                BGG
            </a>
            {{end}}
        </div>
    </div>
</article>
{{end}}
