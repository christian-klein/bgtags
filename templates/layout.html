<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - bgtags</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body>
    <header class="navbar no-print">
        <div class="nav-container">
            <a href="/" class="brand">
                <span class="brand-icon">🎲</span>
                <span class="brand-name">bgtags</span>
                <span class="brand-tag">Rules & QR</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-item {{if eq .ActiveNav "catalog"}}active{{end}}">Catalog</a>
                <a href="/stickers" class="nav-item {{if eq .ActiveNav "stickers"}}active{{end}}">🏷️ Print Stickers</a>
                <button class="nav-item nav-btn" hx-get="/backups/modal" hx-target="#modal-container">💾 Backups</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {{block "content" .}}{{end}}
    </main>

    <div id="modal-container"></div>

    <script>
        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }
    </script>
</body>
</html>
